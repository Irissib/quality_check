<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>quality check</title>
</head>
<body>

<h2>Audio-Test</h2>

<button id="start">Start Aufnahme</button>
<button id="stop" disabled>Stop Aufnahme</button>

<br><br>

<audio id="player" controls></audio>
<p id="status"></p>
<button id="restart" disabled>Neu aufnehmen</button>

<script>
  let recorder;
  let audioChunks = [];

  document.getElementById("start").onclick = async () => {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

    recorder = new MediaRecorder(stream);
    audioChunks = [];

    recorder.ondataavailable = e => audioChunks.push(e.data);

    recorder.onstop = () => {
      const blob = new Blob(audioChunks, { type: recorder.mimeType });
      const url = URL.createObjectURL(blob);
      document.getElementById("player").src = url;
      document.getElementById("restart").disabled = false;
    };

    recorder.start();
    document.getElementById("status").textContent = "Aufnahme läuft...";
    document.getElementById("start").disabled = true;
    document.getElementById("stop").disabled = false;
  };

  document.getElementById("stop").onclick = () => {
    recorder.stop();
    document.getElementById("status").textContent = "Aufnahme gestoppt.";
    document.getElementById("start").disabled = false;
    document.getElementById("stop").disabled = true;
  };
  document.getElementById("restart").onclick = async () => {
  document.getElementById("restart").disabled = true;
  document.getElementById("stop").click();   // alte Aufnahme stoppen
  document.getElementById("start").click();  // neue Aufnahme starten
};
</script>

</body>
</html>
